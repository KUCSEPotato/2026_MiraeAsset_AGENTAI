worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Re-resolve Docker service DNS when the API container is replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        large_client_header_buffers 4 16k;
        location = /frontend-health { return 200 'ok'; }
        location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
        location = /chat { try_files /index.html =404; add_header Cache-Control "no-cache"; }
        location = /chat/ { try_files /index.html =404; add_header Cache-Control "no-cache"; }
        location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
        location ~ ^/(answer|health|live|docs|redoc|openapi\.json)(/|$) {
            set $api_backend agent-api:8000;
            proxy_pass http://$api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 290s;
            proxy_read_timeout 290s;
        }
        location / { return 404; }
    }
}
