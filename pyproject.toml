[project]
name = "financial-semantic-agent"
version = "0.1.0"
description = "Evaluation API baseline for a financial semantic agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "neo4j>=5.28.0,<7.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "rdflib>=7.1.0,<8.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "postgresql: isolated PostgreSQL compatibility integration tests",
    "neo4j: isolated Neo4j Community compatibility integration tests",
    "hyperclova: live HyperCLOVA X integration tests requiring credentials",
]
