name: test-build-deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -p no:capture -p no:debugging

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/financial-semantic-agent:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust pinned deployment host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_HOST_KEY }}' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage exact source tree
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: submission-candidate-${{ github.sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/mirae-agent/releases/$RELEASE_ID/app"
          rsync -az --delete --exclude .git --exclude .env --exclude external_data/ --exclude material/ ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/mirae-agent/releases/$RELEASE_ID/app/"
      - name: Deploy, gate, and promote
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: submission-candidate-${{ github.sha }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "/opt/mirae-agent/releases/$RELEASE_ID/app/scripts/deploy_naver.sh '$RELEASE_ID' '$IMAGE' '${{ github.sha }}'"
