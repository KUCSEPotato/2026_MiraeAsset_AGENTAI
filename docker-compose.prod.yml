name: financial-semantic-agent

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  neo4j:
    image: neo4j:5.26.12-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_listen__address: :7687
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    expose:
      - "7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "username=$${NEO4J_AUTH%%/*}; password=$${NEO4J_AUTH#*/}; cypher-shell -a neo4j://127.0.0.1:7687 -u \"$$username\" -p \"$$password\" 'RETURN 1' >/dev/null",
        ]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  agent-api:
    image: ${AGENT_IMAGE:-financial-semantic-agent}:${AGENT_IMAGE_TAG:-m10.9}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      # These values must use Docker service names in the server-local .env.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEO4J_URI: ${NEO4J_URI:?NEO4J_URI is required}
      NEO4J_USER: ${NEO4J_USER:?NEO4J_USER is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      RUNTIME_DATA_VERSION: ${RUNTIME_DATA_VERSION:?RUNTIME_DATA_VERSION is required}
      TRUSTED_HOLDINGS_RUNTIME_ENABLED: ${TRUSTED_HOLDINGS_RUNTIME_ENABLED:-0}
      PRODUCTION_ARTIFACT_ROOT: /var/lib/financial-semantic-agent
      PRODUCTION_ARTIFACT_MANIFEST: /var/lib/financial-semantic-agent/production-artifacts.json
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:?APP_GIT_COMMIT is required}
      SEMANTIC_INDEX_PATH: /var/lib/financial-semantic-agent/v1/semantic_search.json
      CANONICAL_V2_SEMANTIC_INDEX_PATH: /var/lib/financial-semantic-agent/data/semantic_search.json
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${SEMANTIC_ARTIFACT_ROOT:?SEMANTIC_ARTIFACT_ROOT is required}
        target: /var/lib/financial-semantic-agent
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:

networks:
  backend:
    driver: bridge
